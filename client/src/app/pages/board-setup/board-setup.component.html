<div style="display: flex; flex-direction: column; gap: 0.75rem;">
  <kendo-card [width]="'100%'">
    <kendo-card-body style="padding: 8px; background: var(--surface-container-low); border-radius: var(--radius-lg);">
      <kendo-sortable
        class="board-grid"
        [data]="cells()"
        [animation]="true"
        (dataMove)="onDataMove($event)"
        (dragStart)="onDragStart($event)"
        (dragOver)="onDragOver($event)"
        (dragLeave)="onDragLeave()"
        (dragEnd)="onDragEnd($event)"
      >
        <ng-template kendoSortableItemTemplate let-cellValue="item" let-i="index">
          <button
            kendoButton
            type="button"
            themeColor="primary"
            [fillMode]="i === dragSourceIndex() || i === dragOverIndex() ? 'solid' : 'outline'"
            style="aspect-ratio: 1; width: 100%; padding: 0; font-weight: 800; font-size: 18px; justify-content: center; pointer-events: none;"
          >
            {{ cellValue }}
          </button>
        </ng-template>
      </kendo-sortable>
    </kendo-card-body>
  </kendo-card>

  <kendo-card [width]="'100%'">
    <kendo-card-body style="display: flex; flex-direction: column; gap: 12px; padding: 14px;">
      <div class="headline-md" style="text-align: center;">Arrange your board</div>
      <div style="display: flex; gap: 12px;">
        <button kendoButton themeColor="primary" [rounded]="'large'" size="large" style="flex: 1;" (click)="confirmReady()">Ready</button>
        <button
          kendoButton
          [fillMode]="'outline'"
          [rounded]="'large'"
          size="large"
          style="flex: 1;"
          (click)="randomize(); blurAfterDelay($event.currentTarget)"
        >
          Randomize
        </button>
      </div>
    </kendo-card-body>
  </kendo-card>
</div>
