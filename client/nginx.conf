server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location = / {
    return 302 /bingo/;
  }

  # Socket.IO — must come before the generic /bingo/ static location, and
  # needs the Upgrade headers for the websocket transport to work.
  location /bingo/socket.io/ {
    # No path in proxy_pass — forwards the full /bingo/socket.io/... URI
    # unchanged, matching the server's `path: '/bingo/socket.io'` Socket.IO option.
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # REST API — strips the /bingo prefix so Express sees the /api/* routes it expects.
  location /bingo/api/ {
    proxy_pass http://server:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Angular SPA — client-side routing, so unknown sub-paths fall back to index.html.
  location /bingo/ {
    try_files $uri $uri/ /bingo/index.html;
  }
}
