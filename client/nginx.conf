server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location = / {
    return 302 /bingo/;
  }

  # Socket.IO — must come before the generic /bingo/ static location, and
  # needs the Upgrade headers for the websocket transport to work.
  location /bingo/socket.io/ {
    # No path in proxy_pass — forwards the full /bingo/socket.io/... URI
    # unchanged, matching the server's `path: '/bingo/socket.io'` Socket.IO option.
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # REST API — strips the /bingo prefix so Express sees the /api/* routes it expects.
  location /bingo/api/ {
    proxy_pass http://server:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Hashed build assets (filename changes every deploy) — a real 404 if
  # missing, never the index.html fallback. Without this, a browser/CDN
  # holding a stale index.html from a previous deploy would ask for a chunk
  # that no longer exists on disk and get index.html back with a 200,
  # which the browser then rejects with a confusing MIME-type error
  # instead of a plain, retriable 404.
  location ~* ^/bingo/.+\.(js|css|map|ico|png|jpg|jpeg|svg|webp|woff2?)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Angular SPA — client-side routing, so unknown sub-paths fall back to
  # index.html. Never cache this: it's the one file whose content changes
  # (new hashed asset names) on every deploy without changing its own URL.
  location /bingo/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /bingo/index.html;
  }
}
