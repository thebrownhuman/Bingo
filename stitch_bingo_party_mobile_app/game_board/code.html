  function selectBall(btn, num) {
    document.querySelectorAll('.picker-btn').forEach(b => {

      b.classList.add('bg-surface-container-lowest', 'text-on-surface');

    btn.classList.add('bg-primary-container', 'text-on-primary');
    selectedVal = num;
    document.getElementById('selected-number-display').innerText = num;
  }
