<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><title>Join Party - Bingo Party</title><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "inverse-surface": "#283044", "on-secondary": "#ffffff", "on-error-container": "#93000a", "error-container": "#ffdad6", "on-error": "#ffffff", "inverse-on-surface": "#eef0ff", "primary-fixed": "#e3dfff", "on-primary-container": "#ece8ff", "surface-bright": "#faf8ff", "surface-container-high": "#e2e7ff", "surface": "#faf8ff", "on-surface": "#131b2e", "on-primary-fixed-variant": "#351bd2", "secondary-container": "#6cf8bb", "background": "#faf8ff", "on-tertiary-fixed-variant": "#793000", "secondary-fixed-dim": "#4edea3", "tertiary": "#8a3800", "surface-container-low": "#f2f3ff", "primary-fixed-dim": "#c4c0ff", "secondary-fixed": "#6ffbbe", "primary-container": "#5b4ef5", "inverse-primary": "#c4c0ff", "on-tertiary-container": "#ffe5da", "outline-variant": "#c7c4d8", "secondary": "#006c49", "surface-container": "#eaedff", "tertiary-container": "#b14a00", "on-primary": "#ffffff", "on-surface-variant": "#464556", "on-primary-fixed": "#110068", "surface-container-highest": "#dae2fd", "tertiary-fixed-dim": "#ffb692", "surface-dim": "#d2d9f4", "on-tertiary": "#ffffff", "surface-variant": "#dae2fd", "surface-tint": "#4f40e9", "surface-container-lowest": "#ffffff", "primary": "#412edc", "tertiary-fixed": "#ffdbcb", "on-secondary-fixed-variant": "#005236", "error": "#ba1a1a", "on-background": "#131b2e", "on-tertiary-fixed": "#341100", "on-secondary-fixed": "#002113", "outline": "#777587", "on-secondary-container": "#00714d" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-lg": "1rem", "space-xs": "0.25rem", "space-sm": "0.5rem", "margin": "1rem", "space-md": "0.75rem", "space-xl": "1.5rem", "gutter": "0.5rem" }, "fontFamily": { "body-md": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "tile-header": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "display-hero": ["Plus Jakarta Sans"], "display-hero-mobile": ["Plus Jakarta Sans"], "tile-number": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"] }, "fontSize": { "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "headline-lg": ["24px", { "lineHeight": "30px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "headline-md": ["20px", { "lineHeight": "26px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "tile-header": ["16px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "800" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "500" }], "display-hero": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800" }], "display-hero-mobile": ["32px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "800" }], "tile-number": ["22px", { "lineHeight": "22px", "letterSpacing": "0em", "fontWeight": "800" }], "label-md": ["13px", { "lineHeight": "16px", "fontWeight": "600" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "700" }] } } } }</script></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased flex flex-col min-h-screen"><main class="flex flex-col relative w-full pt-safe pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full px-margin pb-space-xl">
<div class="flex flex-col items-center justify-center pt-space-xl pb-space-lg text-center">
<div class="relative mb-space-md flex items-center justify-center">
<img alt="Bingo Party Logo" class="h-16 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1XGhMvrs_U4IsEGqX84j3VWpxwxBDdLI3w76S4pVth1RrAOLYttLlcy1ByKb_k847mT-HsSDf5-NmdgCM6fAfbKyHrpuMTIAPPr8OFhHsFuPBvbP6LI341kl7SqolkXRpLPvq8bmn9xkwKDcMKNPQz8GC59xpxnzpf2EAx2TczlBa_OUyR5hsjlQIUAf9SJyFi6TWVVSleFUjFZWWSq4q7BEyGgTUl9IMVR3_QOW8F1DNOSJKe1W2aCm2kw"/>
</div>
<h1 class="font-display-hero-mobile text-display-hero-mobile text-on-surface tracking-tight">
      Welcome to Bingo Party
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-space-xs">
      Local network multiplayer game
    </p>
</div>
<div class="w-full max-w-sm mx-auto flex flex-col gap-space-lg">
<div class="bg-surface-container-lowest rounded-xl p-space-lg shadow-sm flex flex-col gap-space-md">
<form class="flex flex-col gap-space-md" id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface font-semibold" for="username">
            Username
          </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline pointer-events-none" style="font-size: 20px;">
              person
            </span>
<input autocomplete="username" class="w-full h-12 pl-10 pr-3 rounded-xl bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline-variant outline-none transition-all duration-150 shadow-[0_2px_0_0_#CBD5E1] focus:shadow-[0_2px_0_0_#5B4EF5]" id="username" placeholder="e.g. lucky_sam" required="" style="outline: none;" type="text"/>
</div>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface font-semibold" for="password">
            Password
          </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline pointer-events-none" style="font-size: 20px;">
              lock
            </span>
<input autocomplete="current-password" class="w-full h-12 pl-10 pr-11 rounded-xl bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline-variant outline-none transition-all duration-150 shadow-[0_2px_0_0_#CBD5E1] focus:shadow-[0_2px_0_0_#5B4EF5]" id="password" placeholder="••••••••" required="" style="outline: none;" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-2 p-1.5 rounded-lg text-outline hover:text-on-surface flex items-center justify-center transition-colors" id="togglePassword" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined" id="pwdEyeIcon" style="font-size: 20px;">
                visibility
              </span>
</button>
</div>
</div>
<button class="w-full h-[50px] mt-space-xs rounded-xl bg-primary-container text-on-primary font-headline-md text-body-lg flex items-center justify-center gap-2 active:translate-y-1 transition-all select-none shadow-[0_4px_0_0_#4338CA] active:shadow-none" id="submitBtn" type="submit">
<span>Sign in</span>
<span class="material-symbols-outlined" style="font-size: 20px; font-variation-settings: 'FILL' 1;">
            arrow_forward
          </span>
</button>
</form>
</div>
<div class="bg-surface-container rounded-xl p-space-md flex items-start gap-space-sm">
<span class="material-symbols-outlined text-primary-container shrink-0 mt-0.5" style="font-size: 20px; font-variation-settings: 'FILL' 1;">
        info
      </span>
<p class="font-body-md text-body-md text-on-surface-variant leading-snug">
        Accounts are pre-assigned by your party host. Ask your host if you need login details.
      </p>
</div>
<div class="flex items-center justify-center pt-space-xs">
<div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-container-high text-on-surface">
<span class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-secondary-fixed-dim opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-secondary"></span>
</span>
<span class="font-label-sm text-label-sm tracking-normal">
          Local party server: <strong class="text-secondary font-bold">online</strong> • 192.168.1.42
        </span>
</div>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('password');
    const eyeIcon = document.getElementById('pwdEyeIcon');
    if (!pwdInput || !eyeIcon) return;
    
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      pwdInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }

  function handleLogin() {
    const btn = document.getElementById('submitBtn');
    if (!btn) return;
    btn.classList.add('opacity-90', 'scale-[0.98]');
    btn.innerHTML = `
      <span class="material-symbols-outlined animate-spin" style="font-size: 20px;">progress_activity</span>
      <span>Connecting...</span>
    `;
    setTimeout(() => {
      btn.classList.remove('opacity-90', 'scale-[0.98]');
      btn.innerHTML = `
        <span>Connected!</span>
        <span class="material-symbols-outlined" style="font-size: 20px;">check_circle</span>
      `;
    }, 900);
  }
</script></main></body></html>
